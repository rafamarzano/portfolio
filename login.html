<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Login | meu.painel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --pink: #FF1493;
    --pink-dark: #E91E8C;
    --pink-pastel: #FFB6D9;
    --white: #FFFFFF;
    --black: #000000;
    --text-soft: #6B6B6B;
    --border: #000000;
    --yellow: #FFEB3B;
    --blue-pastel: #ADD8E6;
    --red-punch: #FF4444;
    --success: #2D7A4F;
    --error: #C4453C;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --border-width: 3px;
    --shadow-hard: 8px 8px 0 var(--black);
    --shadow-hard-sm: 3px 3px 0 var(--black);
    --font-title: 'Fredoka', sans-serif;
    --font-body: 'Outfit', sans-serif;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--pink-pastel);
    background-image: radial-gradient(rgba(255,255,255,.6) 2px, transparent 2px);
    background-size: 22px 22px;
    font-family: var(--font-body);
    color: var(--black);
    padding: 48px 24px;
  }

  .login-wrap{
    width: 100%;
    max-width: 420px;
    position: relative;
  }

  /* Stickers flutuantes ao redor do cartao, so decoracao */
  .floaty{
    position: absolute;
    font-size: 30px;
    pointer-events: none;
    user-select: none;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(1px 1px 0 rgba(0,0,0,.15));
  }
  .floaty-1{ top: -26px; left: -22px; color: var(--yellow); animation-delay: 0s; }
  .floaty-2{ top: -18px; right: -18px; color: var(--pink); font-size: 26px; animation-delay: .7s; }
  .floaty-3{ bottom: -22px; left: 10px; color: var(--blue-pastel); animation-delay: 1.4s; }
  .floaty-4{ bottom: -20px; right: -14px; color: var(--pink); font-size: 22px; animation-delay: 2.1s; }

  @keyframes float{
    0%, 100%{ transform: translateY(0) rotate(-8deg); }
    50%{ transform: translateY(-12px) rotate(8deg); }
  }

  .login-card{
    background: var(--white);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-hard);
    padding: 40px 36px;
    position: relative;
  }

  .logo{
    font-family: var(--font-title);
    font-size: 24px;
    font-weight: 700;
    color: var(--black);
    margin-bottom: 20px;
  }

  .logo .dot{ color: var(--pink); }

  .sticky-note{
    display: inline-block;
    background: var(--yellow);
    border: 2px solid var(--black);
    border-radius: 8px;
    padding: 4px 12px;
    font-family: var(--font-title);
    font-size: 12px;
    font-weight: 600;
    transform: rotate(-4deg);
    box-shadow: 2px 2px 0 var(--black);
    margin-bottom: 14px;
  }

  h1{
    font-family: var(--font-title);
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 8px;
  }

  .subtitle{
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 28px;
  }

  .banner{
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
    line-height: 1.4;
    border: 2px solid var(--black);
    font-weight: 500;
  }

  .banner.error{
    background: #FFE3E3;
    color: var(--error);
  }

  .banner.success{
    background: #E1F5E9;
    color: var(--success);
  }

  form label{
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--black);
    margin-bottom: 16px;
  }

  form input{
    width: 100%;
    margin-top: 6px;
    padding: 12px 14px;
    font-family: var(--font-body);
    font-size: 15px;
    border: 2px solid var(--black);
    border-radius: var(--radius-sm);
    background: var(--white);
    color: var(--black);
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  }

  form input:focus{
    outline: none;
    border-color: var(--pink);
    box-shadow: var(--shadow-hard-sm);
    transform: translate(-1px, -1px);
  }

  button[type="submit"]{
    width: 100%;
    padding: 13px 14px;
    margin-top: 4px;
    border: var(--border-width) solid var(--black);
    border-radius: var(--radius-sm);
    background: var(--pink);
    color: var(--white);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow-hard-sm);
    transition: background .15s ease, transform .1s ease, box-shadow .1s ease;
  }

  button[type="submit"]:hover:not(:disabled){ background: var(--pink-dark); }

  button[type="submit"]:active:not(:disabled){
    transform: translate(3px, 3px);
    box-shadow: none;
  }

  button[type="submit"]:disabled{
    opacity: .7;
    cursor: default;
  }

  .forgot-link{
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-soft);
    text-decoration: none;
  }

  .forgot-link:hover{
    color: var(--pink-dark);
    text-decoration: underline wavy var(--pink);
  }

  [hidden]{ display: none !important; }

  @media (max-width: 480px){
    .login-card{ padding: 32px 24px; }
    .floaty-3, .floaty-4{ display: none; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap">
  <span class="floaty floaty-1" aria-hidden="true">★</span>
  <span class="floaty floaty-2" aria-hidden="true">♥</span>
  <span class="floaty floaty-3" aria-hidden="true">✦</span>
  <span class="floaty floaty-4" aria-hidden="true">♥</span>

  <div class="login-card">
    <div class="logo">meu<span class="dot">.</span>painel</div>

    <div class="sticky-note">bem-vindo(a) de volta!</div>
    <h1>Acesso restrito</h1>
    <p class="subtitle">Faça login para ver os números do seu portfólio.</p>

    <div id="errorBanner" class="banner error" hidden></div>
    <div id="successBanner" class="banner success" hidden></div>

    <!-- Formulário de login -->
    <form id="loginForm">
      <label>
        E-mail
        <input type="email" id="email" required autocomplete="email" placeholder="voce@email.com">
      </label>
      <label>
        Senha
        <input type="password" id="password" required autocomplete="current-password" placeholder="Sua senha">
      </label>
      <button type="submit" id="submitBtn">Entrar</button>
    </form>
    <a href="#" id="forgotLink" class="forgot-link">Esqueci minha senha</a>

    <!-- Formulário de recuperação de senha (começa escondido) -->
    <form id="recoverForm" hidden>
      <label>
        E-mail
        <input type="email" id="recoverEmail" required placeholder="voce@email.com">
      </label>
      <button type="submit" id="recoverBtn">Enviar link de recuperação</button>
    </form>
    <a href="#" id="backToLoginLink" class="forgot-link" hidden>Voltar para o login</a>
  </div>
</div>

<script src="js/auth.js"></script>
<script>
  const loginForm = document.getElementById('loginForm');
  const recoverForm = document.getElementById('recoverForm');
  const forgotLink = document.getElementById('forgotLink');
  const backToLoginLink = document.getElementById('backToLoginLink');
  const errorBanner = document.getElementById('errorBanner');
  const successBanner = document.getElementById('successBanner');
  const submitBtn = document.getElementById('submitBtn');
  const recoverBtn = document.getElementById('recoverBtn');

  function showBanner(el, msg) {
    el.textContent = msg;
    el.hidden = false;
  }
  function hideBanner(el) {
    el.hidden = true;
    el.textContent = '';
  }
  function hideAllBanners() {
    hideBanner(errorBanner);
    hideBanner(successBanner);
  }

  // Se já existe uma sessão ativa, pula direto para o painel.
  (async () => {
    const { data } = await Auth.client.auth.getSession();
    if (data.session) {
      window.location.href = 'painel.html';
    }
  })();

  // Envio do login
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAllBanners();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';

    try {
      await Auth.login(email, password);
      window.location.href = 'painel.html';
    } catch (err) {
      showBanner(errorBanner, err.message || 'Não foi possível entrar. Tente novamente.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });

  // Alterna para o formulário de recuperação de senha
  forgotLink.addEventListener('click', (e) => {
    e.preventDefault();
    hideAllBanners();
    loginForm.hidden = true;
    forgotLink.hidden = true;
    recoverForm.hidden = false;
    backToLoginLink.hidden = false;
  });

  // Volta para o formulário de login
  backToLoginLink.addEventListener('click', (e) => {
    e.preventDefault();
    hideAllBanners();
    recoverForm.hidden = true;
    backToLoginLink.hidden = true;
    loginForm.hidden = false;
    forgotLink.hidden = false;
  });

  // Envio da recuperação de senha
  recoverForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAllBanners();

    const email = document.getElementById('recoverEmail').value.trim();

    recoverBtn.disabled = true;
    recoverBtn.textContent = 'Enviando...';

    try {
      await Auth.recuperarSenha(email);
      showBanner(successBanner, 'Enviamos um link de recuperação para o seu e-mail.');
    } catch (err) {
      showBanner(errorBanner, err.message || 'Não foi possível enviar o e-mail. Tente novamente.');
    } finally {
      recoverBtn.disabled = false;
      recoverBtn.textContent = 'Enviar link de recuperação';
    }
  });
</script>
</body>
</html>
